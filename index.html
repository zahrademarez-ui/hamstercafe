<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamster Café Tycoon : Deluxe ☕🐹</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0; padding: 10px;
      background: #2a1b12; color: #fff;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; user-select: none;
    }

    h1 {
      margin: 5px 0 10px 0; color: #facc15;
      font-size: 26px; text-shadow: 2px 2px 0 #000;
      text-align: center;
    }

    /* Tableau de bord */
    .dashboard {
      background: #432818; border: 3px solid #b45309; border-radius: 12px;
      padding: 8px 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 10px; width: 100%; max-width: 900px;
    }
    .stat-badge {
      font-size: 14px; font-weight: bold; background: #1a100a;
      padding: 6px 12px; border-radius: 15px; border: 2px solid #facc15;
    }

    .main-layout {
      display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
      max-width: 950px; width: 100%;
    }

    /* Le Café (Grille des Tables) */
    .cafe-floor {
      flex: 1; min-width: 300px; background: #6b4423;
      border: 4px solid #d97706; border-radius: 15px; padding: 15px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      align-content: start;
    }

    .table-card {
      background: #432818; border: 3px solid #855835; border-radius: 10px;
      padding: 10px; display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; min-height: 160px; position: relative;
    }
    .table-card.locked {
      background: rgba(26, 16, 10, 0.8); border-style: dashed; justify-content: center; opacity: 0.8;
    }

    .customer-info { font-size: 24px; text-align: center; }
    .customer-name { font-size: 11px; color: #fef08a; font-weight: bold; text-align: center; }
    
    .timer-bar-container {
      width: 100%; height: 6px; background: #1a100a; border-radius: 3px; overflow: hidden; margin: 4px 0;
    }
    .timer-bar { height: 100%; background: #22c55e; width: 100%; transition: width 0.2s linear; }

    .order-bubble {
      background: #fff; color: #000; padding: 4px 8px; border-radius: 12px;
      font-size: 11px; font-weight: bold; margin: 4px 0; border: 2px solid #f59e0b; text-align: center;
    }

    .btn-action {
      background: #22c55e; color: white; border: none; padding: 6px 12px;
      border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 12px;
      box-shadow: 0 3px 0 #15803d; width: 100%; transition: transform 0.1s;
    }
    .btn-action:active { transform: translateY(2px); box-shadow: 0 1px 0 #15803d; }
    .btn-unlock { background: #f59e0b; box-shadow: 0 3px 0 #b45309; color: #000; }

    /* Panneau d'Améliorations */
    .shop-panel {
      flex: 1; min-width: 300px; background: #1a100a;
      border: 4px solid #f59e0b; border-radius: 15px; padding: 12px;
      max-height: 520px; overflow-y: auto;
    }
    .shop-panel h2 { margin: 0 0 8px 0; color: #facc15; font-size: 16px; border-bottom: 2px solid #432818; padding-bottom: 4px; }

    .upgrade-card {
      background: #2a1b12; border: 2px solid #6b4423; border-radius: 8px;
      padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .upgrade-title { font-weight: bold; color: #fff; font-size: 13px; }
    .upgrade-desc { font-size: 10px; color: #cbd5e1; }

    .prestige-box {
      background: linear-gradient(135deg, #7c2d12, #9a3412);
      border: 2px solid #f87171; border-radius: 10px; padding: 10px; margin-bottom: 12px; text-align: center;
    }

    .floating-text {
      position: absolute; color: #facc15; font-weight: bold; font-size: 16px;
      pointer-events: none; animation: floatUp 1s ease-out forwards; text-shadow: 1px 1px 2px #000;
    }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-25px); } }

    .footer-credits { margin-top: 10px; color: #facc15; font-size: 12px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h1>🐹 HAMSTER CAFÉ TYCOON : DELUXE ☕</h1>

  <div class="dashboard">
    <div class="stat-badge" id="miamDisplay">🌾 0 Miams</div>
    <div class="stat-badge" id="reputationDisplay">⭐ Rep: 1.0x</div>
    <div class="stat-badge" id="prestigeDisplay">👑 Prestige: 0</div>
  </div>

  <div class="main-layout">
    <!-- Vue du Café -->
    <div class="cafe-floor" id="cafeFloor"></div>

    <!-- Boutique -->
    <div class="shop-panel">
      <!-- Section Prestige -->
      <div id="prestigeContainer"></div>

      <h2>📜 RECETTES GOURMANDES</h2>
      <div id="recipesContainer"></div>

      <h2>🤖 PERSONNEL & AMÉLIORATIONS</h2>
      <div id="upgradesContainer"></div>
    </div>
  </div>

  <div class="footer-credits">Jeu développé par Adam Demarez !</div>

  <script>
    // --- ÉTAT DU JEU (Sauvegarde LocalStorage) ---
    let miams = parseInt(localStorage.getItem('hc_miams') || '10');
    let reputation = parseFloat(localStorage.getItem('hc_rep') || '1.0');
    let prestigeCount = parseInt(localStorage.getItem('hc_prestige') || '0');
    let autoBaristaUnlocked = JSON.parse(localStorage.getItem('hc_barista') || 'false');
    let maxTables = parseInt(localStorage.getItem('hc_max_tables') || '4');

    // Recettes enrichies (8 au total)
    const RECIPES = [
      { id: 'graines', name: '🌾 Graines Grillées', price: 0, reward: 3, unlocked: true, icon: '🌾' },
      { id: 'latte', name: '☕ Latte Tournesol', price: 25, reward: 9, unlocked: JSON.parse(localStorage.getItem('hc_rec_latte') || 'false'), icon: '☕' },
      { id: 'brioche', name: '🥐 Brioche Noisette', price: 75, reward: 26, unlocked: JSON.parse(localStorage.getItem('hc_rec_brioche') || 'false'), icon: '🥐' },
      { id: 'popcorn', name: '🍿 Pop-Corn Croustillant', price: 160, reward: 55, unlocked: JSON.parse(localStorage.getItem('hc_rec_popcorn') || 'false'), icon: '🍿' },
      { id: 'bubble', name: '🧋 Bubble Tea Cacahuète', price: 320, reward: 115, unlocked: JSON.parse(localStorage.getItem('hc_rec_bubble') || 'false'), icon: '🧋' },
      { id: 'gateau', name: '🍰 Gâteau au Miel', price: 700, reward: 250, unlocked: JSON.parse(localStorage.getItem('hc_rec_gateau') || 'false'), icon: '🍰' },
      { id: 'smoothie', name: '🥤 Smoothie de Luxe', price: 1500, reward: 580, unlocked: JSON.parse(localStorage.getItem('hc_rec_smoothie') || 'false'), icon: '🥤' },
      { id: 'festin', name: '👑 Festin Royal de Noix', price: 3500, reward: 1400, unlocked: JSON.parse(localStorage.getItem('hc_rec_festin') || 'false'), icon: '👑' }
    ];

    // Clients normaux et VIP
    const CUSTOMER_TYPES = [
      { name: 'Hamster Gourmet', icon: '🐹', multiplier: 1, vip: false },
      { name: 'Hamster Hipster', icon: '🐹', multiplier: 1, vip: false },
      { name: 'Lapin Gourmand', icon: '🐰', multiplier: 1.2, vip: false },
      { name: 'Souris Élégante', icon: '🐭', multiplier: 1.3, vip: false },
      { name: '👑 Hamster VIP Royal', icon: '🦁🐹', multiplier: 3.5, vip: true }
    ];

    // Tables (jusqu'à 6 max après prestige)
    let tables = [];
    function initTables() {
      tables = [];
      const costs = [0, 0, 40, 120, 300, 750];
      for (let i = 0; i < maxTables; i++) {
        tables.push({
          id: i,
          unlocked: i < 2 || (i < 4 && maxTables >= 4),
          unlockCost: costs[i] || 500,
          customer: null
        });
      }
    }
    initTables();

    function saveGame() {
      localStorage.setItem('hc_miams', miams);
      localStorage.setItem('hc_rep', reputation);
      localStorage.setItem('hc_prestige', prestigeCount);
      localStorage.setItem('hc_barista', autoBaristaUnlocked);
      localStorage.setItem('hc_max_tables', maxTables);
      RECIPES.forEach(r => localStorage.setItem(`hc_rec_${r.id}`, r.unlocked));
    }

    function updateUI() {
      document.getElementById('miamDisplay').innerText = `🌾 ${Math.floor(miams)} Miams`;
      document.getElementById('reputationDisplay').innerText = `⭐ Rep: ${reputation.toFixed(1)}x`;
      document.getElementById('prestigeDisplay').innerText = `👑 Prestige: ${prestigeCount}`;
      renderPrestige();
      renderShop();
      renderTables();
      saveGame();
    }

    function renderPrestige() {
      const container = document.getElementById('prestigeContainer');
      if (miams >= 500 || prestigeCount > 0) {
        container.innerHTML = `
          <div class="prestige-box">
            <div style="font-weight:bold; color:#f87171; font-size:13px;">🌀 RENAISSANCE (PRESTIGE)</div>
            <div style="font-size:10px; color:#cbd5e1; margin:3px 0;">Remet les miams à 0 mais débloque 6 places max et +0.5x de réputation permanente !</div>
            <button class="btn-action" style="background:#dc2626;" onclick="doPrestige()">Faire une Renaissance (500 🌾)</button>
          </div>
        `;
      } else {
        container.innerHTML = '';
      }
    }

    function doPrestige() {
      if (miams >= 500) {
        if (confirm('Es-tu sûr de vouloir recommencer ton café avec des avantages légendaires ?')) {
          miams = 10;
          prestigeCount++;
          reputation += 0.5;
          maxTables = 6;
          autoBaristaUnlocked = false;
          RECIPES.forEach((r, idx) => r.unlocked = idx === 0);
          initTables();
          updateUI();
        }
      }
    }

    function renderTables() {
      const container = document.getElementById('cafeFloor');
      container.innerHTML = '';

      tables.forEach(table => {
        const card = document.createElement('div');
        card.className = `table-card ${table.unlocked ? '' : 'locked'}`;

        if (!table.unlocked) {
          card.innerHTML = `
            <div style="font-size:11px; font-weight:bold; margin-bottom:6px;">Table #${table.id + 1}</div>
            <button class="btn-action btn-unlock" onclick="unlockTable(${table.id})">Débloquer (${table.unlockCost} 🌾)</button>
          `;
        } else if (table.customer) {
          const c = table.customer;
          const pct = (c.timeLeft / c.maxTime) * 100;
          let barColor = '#22c55e';
          if (c.timeLeft < 15) barColor = '#ef4444'; // Alerte dans les 15 dernières secondes

          let actionHTML = '';
          if (c.state === 'waiting') {
            actionHTML = `<button class="btn-action" onclick="serveCustomer(${table.id})">Servir !</button>`;
          } else {
            actionHTML = `<div style="font-size:11px; color:#22c55e; font-weight:bold; text-align:center;">Dégustation...</div>`;
          }

          card.innerHTML = `
            <div class="customer-info">${c.icon}</div>
            <div class="customer-name">${c.name}</div>
            <div class="timer-bar-container"><div class="timer-bar" style="width: ${pct}%; background: ${barColor};"></div></div>
            <div class="order-bubble">${c.order.icon} ${c.order.name}</div>
            ${actionHTML}
          `;
        } else {
          card.innerHTML = `
            <div style="font-size:11px; color:#d97706; font-weight:bold;">Table Libre</div>
            <div style="font-size:24px; opacity:0.3;">🪑</div>
          `;
        }

        container.appendChild(card);
      });
    }

    function renderShop() {
      // Recettes
      const recipesContainer = document.getElementById('recipesContainer');
      recipesContainer.innerHTML = '';

      RECIPES.forEach(r => {
        if (!r.unlocked) {
          const card = document.createElement('div');
          card.className = 'upgrade-card';
          card.innerHTML = `
            <div>
              <div class="upgrade-title">${r.icon} ${r.name}</div>
              <div class="upgrade-desc">Rapporte +${r.reward} 🌾</div>
            </div>
            <button class="btn-action btn-unlock" onclick="buyRecipe('${r.id}')">${r.price} 🌾</button>
          `;
          recipesContainer.appendChild(card);
        }
      });

      if (recipesContainer.children.length === 0) {
        recipesContainer.innerHTML = '<div style="font-size:11px; color:#22c55e;">Toutes les recettes sont débloquées ! 🌟</div>';
      }

      // Améliorations
      const upgradesContainer = document.getElementById('upgradesContainer');
      upgradesContainer.innerHTML = '';

      if (!autoBaristaUnlocked) {
        upgradesContainer.innerHTML = `
          <div class="upgrade-card">
            <div>
              <div class="upgrade-title">🤖 Robot Barista</div>
              <div class="upgrade-desc">Sert tes clients automatiquement !</div>
            </div>
            <button class="btn-action btn-unlock" onclick="buyBarista()">1067 🌾</button>
          </div>
        `;
      } else {
        upgradesContainer.innerHTML = `<div style="font-size:11px; color:#22c55e;">🤖 Robot Barista actif !</div>`;
      }
    }

    function unlockTable(id) {
      const table = tables.find(t => t.id === id);
      if (table && miams >= table.unlockCost) {
        miams -= table.unlockCost;
        table.unlocked = true;
        updateUI();
      } else {
        alert('Pas assez de Miams !');
      }
    }

    function buyRecipe(id) {
      const recipe = RECIPES.find(r => r.id === id);
      if (recipe && miams >= recipe.price) {
        miams -= recipe.price;
        recipe.unlocked = true;
        updateUI();
      } else {
        alert('Pas assez de Miams !');
      }
    }

    function buyBarista() {
      if (miams >= 1067) {
        miams -= 1067;
        autoBaristaUnlocked = true;
        updateUI();
      } else {
        alert('Il te faut 1067 Miams pour acheter le Robot Barista !');
      }
    }

    function spawnCustomers() {
      const unlockedRecipes = RECIPES.filter(r => r.unlocked);

      tables.forEach(table => {
        if (table.unlocked && !table.customer && Math.random() < 0.45) {
          // Plus la réputation est haute, plus les VIP ont de chances de venir
          let validCustomers = CUSTOMER_TYPES;
          if (reputation < 2.0) {
            validCustomers = CUSTOMER_TYPES.filter(c => !c.vip);
          }
          const randomType = validCustomers[Math.floor(Math.random() * validCustomers.length)];
          const randomOrder = unlockedRecipes[Math.floor(Math.random() * unlockedRecipes.length)];

          table.customer = {
            name: randomType.name,
            icon: randomType.icon,
            multiplier: randomType.multiplier,
            order: randomOrder,
            state: 'waiting',
            maxTime: 45,
            timeLeft: 45
          };
        }
      });
      updateUI();
    }

    function serveCustomer(tableId) {
      const table = tables.find(t => t.id === tableId);
      if (table && table.customer && table.customer.state === 'waiting') {
        table.customer.state = 'eating';
        updateUI();

        setTimeout(() => {
          if (table.customer) {
            const baseGain = table.customer.order.reward * reputation * table.customer.multiplier;
            const gain = Math.floor(baseGain);
            miams += gain;

            showFloatingText(`+${gain} 🌾`, tableId);
            table.customer = null;
            updateUI();
          }
        }, 1000);
      }
    }

    function showFloatingText(text, tableId) {
      const tableCards = document.querySelectorAll('.table-card');
      if (tableCards[tableId]) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = '35%';
        el.style.top = '25%';
        tableCards[tableId].appendChild(el);
        setTimeout(() => el.remove(), 1000);
      }
    }

    // --- BOUCLE DU JEU (Chrono, Clients & Pénalités) ---
    setInterval(() => {
      spawnCustomers();
    }, 2500);

    setInterval(() => {
      tables.forEach(t => {
        if (t.customer && t.customer.state === 'waiting') {
          t.customer.timeLeft -= 1;

          // Pénalité dans les 15 dernières secondes si non servi
          if (t.customer.timeLeft === 15) {
            showFloatingText('⚠️ S\'ÉNERVE !', t.id);
          }

          if (t.customer.timeLeft <= 0) {
            // Client mécontent : perte de réputation et de miams
            miams = Math.max(0, miams - 10);
            reputation = Math.max(0.5, reputation - 0.1);
            showFloatingText('-10 🌾 😡', t.id);
            t.customer = null;
            updateUI();
          }
        }
      });

      // Robot barista automatique
      if (autoBaristaUnlocked) {
        tables.forEach(t => {
          if (t.unlocked && t.customer && t.customer.state === 'waiting') {
            serveCustomer(t.id);
          }
        });
      }

      updateUI();
    }, 1000);

    updateUI();
  </script>
</body>
</html>
